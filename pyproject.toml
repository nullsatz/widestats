[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "widestats"
version = "0.1.0.dev0"
description = "GPU statistics for wide data: strongest correlated pairs, permutation tests with maxT, on PyTorch"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Josh Buckner", email = "nullsatz@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Source = "https://github.com/nullsatz/widestats"

[tool.pytest.ini_options]
testpaths = ["tests"]
