[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "widestats"
version = "0.1.0"
description = "Statistics for wide data on a GPU, on PyTorch: strongest correlated pairs, permutation and maxT tests, Granger causality and mutual information of every pair"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Josh Buckner", email = "nullsatz@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "pandas"]
docs = ["pdoc>=14"]

[project.urls]
Documentation = "https://nullsatz.github.io/widestats/"
Source = "https://github.com/nullsatz/widestats"
Issues = "https://github.com/nullsatz/widestats/issues"

[tool.hatch.build.targets.sdist]
exclude = [".github", "bench/results"]

[tool.pytest.ini_options]
# the docstring examples run as tests too, so they cannot go stale
testpaths = ["tests", "src/widestats"]
addopts = "--doctest-modules"

[tool.coverage.run]
source = ["widestats"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, NumPy-specific,
# ruff's own, and docstrings in the NumPy convention
select = ["F", "E", "W", "I", "B", "UP", "NPY", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# tests document themselves by their names and module docstrings
"tests/*" = ["D100", "D103"]
