# Build and upload a release to PyPI when a version tag is pushed.
#
# Uploads use PyPI's trusted publishing: the "pypi" environment of this
# repository is registered as the publisher of the widestats project, so no
# token is stored anywhere. Tag a commit on main as v<version>, matching the
# version in pyproject.toml, and push the tag.
name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} but pyproject.toml says $version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/widestats/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
